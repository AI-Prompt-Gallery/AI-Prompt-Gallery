<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Prompt Gallery — AI Image Prompt Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            lightMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); }
        .light .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen transition-colors duration-200 light:bg-slate-50 light:text-slate-900 font-sans">

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 border-b border-slate-800 bg-slate-950/80 backdrop-blur-md light:bg-white/80 light:border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20 font-bold text-xl">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-tight text-white light:text-slate-900">Ai Prompt Gallery</h1>
                    <p class="text-xs text-slate-400">AI Image Prompt Library</p>
                </div>
            </div>

            <!-- Header Actions -->
            <div class="flex items-center gap-3">
                <!-- Theme Toggle -->
                <button id="theme-toggle" class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors light:hover:bg-slate-100 light:hover:text-slate-900">
                    <i class="fa-solid fa-moon text-lg light:hidden"></i>
                    <i class="fa-solid fa-sun text-lg hidden light:block"></i>
                </button>

                <!-- Admin Action Group -->
                <div id="admin-action-group" class="hidden items-center gap-2">
                    <span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Admin Mode
                    </span>
                    <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-1.5 rounded-lg text-sm font-medium transition-all shadow-lg shadow-indigo-600/20 flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Add Prompt</span>
                    </button>
                    <button onclick="openAdminSettings()" class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>

                <!-- Admin Login Button -->
                <button id="admin-login-btn" onclick="openLoginModal()" class="border border-slate-700 hover:border-slate-500 text-slate-300 hover:text-white px-3.5 py-1.5 rounded-lg text-sm font-medium transition-all light:border-slate-300 light:text-slate-700 light:hover:bg-slate-100">
                    <i class="fa-solid fa-lock mr-1.5 text-xs"></i> Admin Access
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Search & Filter Controls -->
        <section class="mb-8 space-y-4">
            <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                <!-- Search Bar -->
                <div class="relative w-full md:w-96">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-input" placeholder="Search prompts, tags, concepts..." class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent light:bg-white light:border-slate-300 light:text-slate-900">
                </div>

                <!-- Filter Controls -->
                <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                    <!-- Model Filter -->
                    <select id="model-filter" class="px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 light:bg-white light:border-slate-300 light:text-slate-700">
                        <option value="all">All Models</option>
                        <option value="Midjourney v6">Midjourney v6</option>
                        <option value="DALL-E 3">DALL-E 3</option>
                        <option value="Stable Diffusion XL">Stable Diffusion XL</option>
                        <option value="FLUX.1">FLUX.1</option>
                    </select>

                    <!-- Aspect Ratio Filter -->
                    <select id="ratio-filter" class="px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 light:bg-white light:border-slate-300 light:text-slate-700">
                        <option value="all">All Ratios</option>
                        <option value="16:9">16:9 Landscape</option>
                        <option value="9:16">9:16 Portrait</option>
                        <option value="1:1">1:1 Square</option>
                    </select>

                    <!-- Data Backup Button -->
                    <button onclick="exportJSONData()" class="px-3 py-2 rounded-xl border border-slate-800 bg-slate-900 hover:bg-slate-800 text-slate-300 text-sm font-medium transition-colors light:bg-white light:border-slate-300 light:text-slate-700">
                        <i class="fa-solid fa-download mr-1.5 text-xs"></i> Export JSON
                    </button>
                </div>
            </div>

            <!-- Category Filter Pills -->
            <div id="category-pills" class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
                <!-- Dynamic Pills Render Here -->
            </div>
        </section>

        <!-- Prompts Grid -->
        <section id="prompts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Prompt Cards Render Here -->
        </section>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-16">
            <div class="w-16 h-16 rounded-full bg-slate-900 flex items-center justify-center mx-auto mb-4 text-slate-500 text-2xl border border-slate-800">
                <i class="fa-solid fa-ghost"></i>
            </div>
            <h3 class="text-lg font-semibold text-slate-300">No prompts found</h3>
            <p class="text-slate-500 text-sm mt-1">Try adjusting your filters or search terms.</p>
        </div>
    </main>

    <!-- Modals & Scripts included in canvas file -->
    <script>
        // Initial Seed Database
        const defaultPrompts = [
            {
                id: 1,
                title: "Cyberpunk Neon Samurai",
                model: "Midjourney v6",
                category: "Cyberpunk",
                aspectRatio: "16:9",
                prompt: "A futuristic samurai warrior standing in rain-slicked neon-lit streets of Neo-Tokyo, volumetric lighting, photorealistic octane render, 8k resolution, cinematic composition.",
                negativePrompt: "blurry, low quality, distorted hands, extra limbs",
                stylize: "250",
                seed: "4829104",
                image: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&auto=format&fit=crop&q=60"
            },
            {
                id: 2,
                title: "Hyper-Detailed Crystal Dragon",
                model: "DALL-E 3",
                category: "Fantasy",
                aspectRatio: "1:1",
                prompt: "A majestic crystalline dragon perched atop a snowy mountain peak during sunset, glass refractivity, golden hour lighting, hyper-detailed fantasy art.",
                negativePrompt: "cartoon, flat shading, low detail",
                stylize: "100",
                seed: "9912041",
                image: "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=800&auto=format&fit=crop&q=60"
            },
            {
                id: 3,
                title: "Minimalist Concrete Villa",
                model: "FLUX.1",
                category: "Architecture",
                aspectRatio: "16:9",
                prompt: "Modern architectural exterior of a minimalist luxury concrete villa surrounded by brutalist gardens and calm reflection pools, soft morning fog, ArchDaily style photography.",
                negativePrompt: "cluttered, overexposed, noise",
                stylize: "50",
                seed: "1104823",
                image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800&auto=format&fit=crop&q=60"
            }
        ];

        // State Management
        let prompts = JSON.parse(localStorage.getItem('prompt_vault_db')) || defaultPrompts;
        let isAdmin = localStorage.getItem('prompt_vault_admin') === 'true';
        let adminPassword = localStorage.getItem('prompt_vault_pw') || 'captainprabhu@1504';
        let selectedCategory = 'all';

        // Render Functions
        function renderPrompts() {
            const container = document.getElementById('prompts-grid');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const modelVal = document.getElementById('model-filter').value;
            const ratioVal = document.getElementById('ratio-filter').value;

            const filtered = prompts.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(searchVal) || p.prompt.toLowerCase().includes(searchVal);
                const matchesModel = modelVal === 'all' || p.model === modelVal;
                const matchesRatio = ratioVal === 'all' || p.aspectRatio === ratioVal;
                const matchesCategory = selectedCategory === 'all' || p.category === selectedCategory;
                return matchesSearch && matchesModel && matchesRatio && matchesCategory;
            });

            if (filtered.length === 0) {
                container.innerHTML = '';
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }

            document.getElementById('empty-state').classList.add('hidden');
            container.innerHTML = filtered.map(p => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-slate-700 transition-all flex flex-col group">
                    <div class="relative aspect-video overflow-hidden bg-slate-950">
                        <img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        <div class="absolute top-3 left-3 bg-slate-950/80 backdrop-blur-md px-2.5 py-1 rounded-full text-xs text-slate-300 font-medium border border-slate-800">
                            ${p.model}
                        </div>
                        ${isAdmin ? `
                            <div class="absolute top-3 right-3 flex gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="deletePrompt(${p.id})" class="p-1.5 bg-rose-500/90 hover:bg-rose-600 text-white rounded-lg text-xs">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        ` : ''}
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <h3 class="font-bold text-slate-100 text-base">${p.title}</h3>
                                <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400">${p.aspectRatio}</span>
                            </div>
                            <p class="text-slate-400 text-sm line-clamp-3 mb-4">${p.prompt}</p>
                        </div>
                        <div class="flex gap-2 pt-3 border-t border-slate-800/60">
                            <button onclick="copyText('${escapeJs(p.prompt)}')" class="flex-1 py-2 bg-indigo-600/10 hover:bg-indigo-600/20 text-indigo-400 rounded-xl text-xs font-semibold transition-colors flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-copy"></i> Copy Prompt
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function escapeJs(str) { return str.replace(/'/g, "\\'").replace(/"/g, '\\"'); }
        function copyText(text) { navigator.clipboard.writeText(text); alert("Prompt copied to clipboard!"); }
        
        // Initial setup
        document.addEventListener('DOMContentLoaded', () => {
            renderPrompts();
            if (isAdmin) {
                document.getElementById('admin-action-group').classList.remove('hidden');
                document.getElementById('admin-action-group').classList.add('flex');
                document.getElementById('admin-login-btn').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
