<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompts Gallery — AI Image Prompt Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen font-sans">

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/80 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20 font-bold text-xl">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-tight text-slate-900">Prompts Gallery</h1>
                    <p class="text-xs text-slate-500">AI Image Prompt Library</p>
                </div>
            </div>

            <!-- Header Actions -->
            <div class="flex items-center gap-3">
                <!-- Admin Action Group -->
                <div id="admin-action-group" class="hidden items-center gap-2">
                    <span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-600 border border-emerald-500/20 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Admin Mode
                    </span>
                    <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-1.5 rounded-lg text-sm font-medium transition-all shadow-lg shadow-indigo-600/20 flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Add Prompt</span>
                    </button>
                    <button onclick="openAdminSettings()" class="p-2 rounded-lg text-slate-500 hover:text-slate-900 hover:bg-slate-100 transition-colors">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                    <button onclick="logoutAdmin()" class="p-2 rounded-lg text-rose-600 hover:bg-rose-500/10 transition-colors" title="Lock Admin">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>

                <!-- Admin Login Button -->
                <button id="admin-login-btn" onclick="openLoginModal()" class="border border-slate-300 hover:border-slate-400 text-slate-700 hover:bg-slate-100 px-3.5 py-1.5 rounded-lg text-sm font-medium transition-all">
                    <i class="fa-solid fa-lock mr-1.5 text-xs"></i> Admin Access
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Search & Filter Controls -->
        <section class="mb-8 space-y-4">
            <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                <!-- Search Bar -->
                <div class="relative w-full md:w-96">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-input" oninput="renderPrompts()" placeholder="Search prompts, tags, concepts..." class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-white border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent shadow-sm">
                </div>

                <!-- Filter Controls -->
                <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                    <!-- Model Filter -->
                    <select id="model-filter" onchange="renderPrompts()" class="px-3 py-2 rounded-xl bg-white border border-slate-300 text-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
                        <option value="all">All Models</option>
                        <option value="Midjourney v6">Midjourney v6</option>
                        <option value="DALL-E 3">DALL-E 3</option>
                        <option value="Stable Diffusion XL">Stable Diffusion XL</option>
                        <option value="FLUX.1">FLUX.1</option>
                    </select>

                    <!-- Aspect Ratio Filter -->
                    <select id="ratio-filter" onchange="renderPrompts()" class="px-3 py-2 rounded-xl bg-white border border-slate-300 text-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
                        <option value="all">All Ratios</option>
                        <option value="16:9">16:9 Landscape</option>
                        <option value="9:16">9:16 Portrait</option>
                        <option value="1:1">1:1 Square</option>
                    </select>
                </div>
            </div>

            <!-- Category Filter Pills -->
            <div id="category-pills" class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
                <!-- Dynamic Pills Render Here -->
            </div>
        </section>

        <!-- Prompts Grid -->
        <section id="prompts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Prompt Cards Render Here -->
        </section>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-16">
            <div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center mx-auto mb-4 text-slate-400 text-2xl border border-slate-200">
                <i class="fa-solid fa-ghost"></i>
            </div>
            <h3 class="text-lg font-semibold text-slate-700">No prompts found</h3>
            <p class="text-slate-500 text-sm mt-1">Try adjusting your filters or search terms.</p>
        </div>
    </main>

    <!-- Admin Login Modal -->
    <div id="login-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white border border-slate-200 w-full max-w-md rounded-2xl p-6 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-lg text-slate-900">Admin Authentication</h3>
                <button onclick="closeLoginModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-slate-500 text-sm mb-4">Enter your master admin password to unlock creation and editing rights.</p>
            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                    <input type="password" id="admin-pass-input" required class="w-full px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeLoginModal()" class="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 text-sm">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium">Unlock Admin</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add/Edit Prompt Modal -->
    <div id="prompt-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white border border-slate-200 w-full max-w-xl rounded-2xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 id="modal-title" class="font-bold text-lg text-slate-900">Add New Prompt</h3>
                <button onclick="closePromptModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="prompt-form" onsubmit="savePrompt(event)" class="space-y-4">
                <input type="hidden" id="prompt-id">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Title</label>
                        <input type="text" id="p-title" required class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Category</label>
                        <input type="text" id="p-category" required placeholder="e.g. Cyberpunk, Fantasy" class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Model</label>
                        <select id="p-model" class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="Midjourney v6">Midjourney v6</option>
                            <option value="DALL-E 3">DALL-E 3</option>
                            <option value="Stable Diffusion XL">Stable Diffusion XL</option>
                            <option value="FLUX.1">FLUX.1</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Aspect Ratio</label>
                        <select id="p-ratio" class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="16:9">16:9 Landscape</option>
                            <option value="9:16">9:16 Portrait</option>
                            <option value="1:1">1:1 Square</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Prompt Text</label>
                    <textarea id="p-text" rows="3" required class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Image URL</label>
                    <input type="url" id="p-image" required placeholder="https://images.unsplash.com/..." class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closePromptModal()" class="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 text-sm">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium">Save Prompt</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Admin Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white border border-slate-200 w-full max-w-md rounded-2xl p-6 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-lg text-slate-900">Admin Settings</h3>
                <button onclick="closeAdminSettings()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="changePassword(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">New Master Password</label>
                    <input type="password" id="new-password-input" required class="w-full px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeAdminSettings()" class="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 text-sm">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium">Update Password</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Core Script Logic -->
    <script>
        const defaultPrompts = [
            {
                id: 1,
                title: "Cyberpunk Neon Samurai",
                model: "Midjourney v6",
                category: "Cyberpunk",
                aspectRatio: "16:9",
                prompt: "A futuristic samurai warrior standing in rain-slicked neon-lit streets of Neo-Tokyo, volumetric lighting, photorealistic octane render, 8k resolution, cinematic composition.",
                image: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&auto=format&fit=crop&q=60"
            },
            {
                id: 2,
                title: "Hyper-Detailed Crystal Dragon",
                model: "DALL-E 3",
                category: "Fantasy",
                aspectRatio: "1:1",
                prompt: "A majestic crystalline dragon perched atop a snowy mountain peak during sunset, glass refractivity, golden hour lighting, hyper-detailed fantasy art.",
                image: "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=800&auto=format&fit=crop&q=60"
            },
            {
                id: 3,
                title: "Minimalist Concrete Villa",
                model: "FLUX.1",
                category: "Architecture",
                aspectRatio: "16:9",
                prompt: "Modern architectural exterior of a minimalist luxury concrete villa surrounded by brutalist gardens and calm reflection pools, soft morning fog, ArchDaily style photography.",
                image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800&auto=format&fit=crop&q=60"
            }
        ];

        let prompts = JSON.parse(localStorage.getItem('prompt_vault_db')) || defaultPrompts;
        let isAdmin = localStorage.getItem('prompt_vault_admin') === 'true';
        let adminPassword = localStorage.getItem('prompt_vault_pw') || 'prabhu';
        let selectedCategory = 'all';

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl text-sm font-medium shadow-lg transition-all duration-300 transform translate-y-2 opacity-0 ${type === 'success' ? 'bg-indigo-600 text-white' : 'bg-rose-600 text-white'}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function renderCategories() {
            const categories = ['all', ...new Set(prompts.map(p => p.category))];
            const container = document.getElementById('category-pills');
            container.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" class="px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-colors ${selectedCategory === cat ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20' : 'bg-white border border-slate-300 text-slate-700 hover:bg-slate-100'}">
                    ${cat.charAt(0).toUpperCase() + cat.slice(1)}
                </button>
            `).join('');
        }

        function setCategory(cat) {
            selectedCategory = cat;
            renderCategories();
            renderPrompts();
        }

        function renderPrompts() {
            renderCategories();
            const container = document.getElementById('prompts-grid');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const modelVal = document.getElementById('model-filter').value;
            const ratioVal = document.getElementById('ratio-filter').value;

            const filtered = prompts.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(searchVal) || p.prompt.toLowerCase().includes(searchVal);
                const matchesModel = modelVal === 'all' || p.model === modelVal;
                const matchesRatio = ratioVal === 'all' || p.aspectRatio === ratioVal;
                const matchesCategory = selectedCategory === 'all' || p.category === selectedCategory;
                return matchesSearch && matchesModel && matchesRatio && matchesCategory;
            });

            if (filtered.length === 0) {
                container.innerHTML = '';
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }

            document.getElementById('empty-state').classList.add('hidden');
            container.innerHTML = filtered.map(p => `
                <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden hover:border-slate-300 shadow-sm hover:shadow-md transition-all flex flex-col group">
                    <div class="relative aspect-video overflow-hidden bg-slate-100">
                        <img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-md px-2.5 py-1 rounded-full text-xs text-slate-700 font-medium border border-slate-200 shadow-sm">
                            ${p.model}
                        </div>
                        ${isAdmin ? `
                            <div class="absolute top-3 right-3 flex gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="openEditModal(${p.id})" class="p-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs shadow">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button onclick="deletePrompt(${p.id})" class="p-1.5 bg-rose-500 hover:bg-rose-600 text-white rounded-lg text-xs shadow">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        ` : ''}
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <h3 class="font-bold text-slate-900 text-base">${p.title}</h3>
                                <span class="text-xs px-2 py-0.5 rounded bg-slate-100 text-slate-600 border border-slate-200">${p.aspectRatio}</span>
                            </div>
                            <p class="text-slate-600 text-sm line-clamp-3 mb-4">${p.prompt}</p>
                        </div>
                        <div class="flex gap-2 pt-3 border-t border-slate-100">
                            <button onclick="copyText('${escapeJs(p.prompt)}')" class="flex-1 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-xl text-xs font-semibold transition-colors flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-copy"></i> Copy Prompt
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function escapeJs(str) { return str.replace(/'/g, "\\'").replace(/"/g, '\\"'); }
        function copyText(text) { 
            navigator.clipboard.writeText(text); 
            showToast("Prompt copied to clipboard!"); 
        }

        // Auth & Modals
        function openLoginModal() { document.getElementById('login-modal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('login-modal').classList.add('hidden'); document.getElementById('admin-pass-input').value = ''; }
        
        function handleAdminLogin(e) {
            e.preventDefault();
            const val = document.getElementById('admin-pass-input').value;
            if (val === adminPassword) {
                isAdmin = true;
                localStorage.setItem('prompt_vault_admin', 'true');
                closeLoginModal();
                updateAdminUI();
                renderPrompts();
                showToast("Admin access granted!");
            } else {
                showToast("Incorrect password!", "error");
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            localStorage.setItem('prompt_vault_admin', 'false');
            updateAdminUI();
            renderPrompts();
            showToast("Logged out of admin mode.");
        }

        function updateAdminUI() {
            const group = document.getElementById('admin-action-group');
            const btn = document.getElementById('admin-login-btn');
            if (isAdmin) {
                group.classList.remove('hidden');
                group.classList.add('flex');
                btn.classList.add('hidden');
            } else {
                group.classList.add('hidden');
                group.classList.remove('flex');
                btn.classList.remove('hidden');
            }
        }

        function openAddModal() {
            document.getElementById('modal-title').textContent = "Add New Prompt";
            document.getElementById('prompt-id').value = "";
            document.getElementById('prompt-form').reset();
            document.getElementById('prompt-modal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const p = prompts.find(x => x.id === id);
            if (!p) return;
            document.getElementById('modal-title').textContent = "Edit Prompt";
            document.getElementById('prompt-id').value = p.id;
            document.getElementById('p-title').value = p.title;
            document.getElementById('p-category').value = p.category;
            document.getElementById('p-model').value = p.model;
            document.getElementById('p-ratio').value = p.aspectRatio;
            document.getElementById('p-text').value = p.prompt;
            document.getElementById('p-image').value = p.image;
            document.getElementById('prompt-modal').classList.remove('hidden');
        }

        function closePromptModal() { document.getElementById('prompt-modal').classList.add('hidden'); }

        function savePrompt(e) {
            e.preventDefault();
            const id = document.getElementById('prompt-id').value;
            const data = {
                id: id ? parseInt(id) : Date.now(),
                title: document.getElementById('p-title').value,
                category: document.getElementById('p-category').value.trim(),
                model: document.getElementById('p-model').value,
                aspectRatio: document.getElementById('p-ratio').value,
                prompt: document.getElementById('p-text').value,
                image: document.getElementById('p-image').value
            };

            if (id) {
                const idx = prompts.findIndex(x => x.id === parseInt(id));
                if (idx !== -1) prompts[idx] = data;
                showToast("Prompt updated successfully!");
            } else {
                prompts.unshift(data);
                showToast("Prompt added successfully!");
            }

            localStorage.setItem('prompt_vault_db', JSON.stringify(prompts));
            closePromptModal();
            renderPrompts();
        }

        function deletePrompt(id) {
            if (confirm("Are you sure you want to delete this prompt?")) {
                prompts = prompts.filter(p => p.id !== id);
                localStorage.setItem('prompt_vault_db', JSON.stringify(prompts));
                renderPrompts();
                showToast("Prompt deleted.");
            }
        }

        function openAdminSettings() { document.getElementById('settings-modal').classList.remove('hidden'); }
        function closeAdminSettings() { document.getElementById('settings-modal').classList.add('hidden'); }

        function changePassword(e) {
            e.preventDefault();
            const newPw = document.getElementById('new-password-input').value;
            adminPassword = newPw;
            localStorage.setItem('prompt_vault_pw', newPw);
            closeAdminSettings();
            showToast("Admin password updated!");
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Force clean light mode initialization
            localStorage.removeItem('theme');
            document.documentElement.className = 'light';
            updateAdminUI();
            renderPrompts();
        });
    </script>
</body>
</html>
